name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test CLI bundle
        run: pnpm -C apps/echadron run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --shard=${{ matrix.shard }}/5

  # pi-tui's suite runs on node:test (not vitest), so the root `pnpm run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yaseenhq/pi-tui test

  # Does a fresh install actually launch on Windows? The full suite still has
  # unresolved POSIX-only assumptions (see the disabled job below), but that is
  # no reason to ship Windows untested: this packs the real tarball, installs it
  # the way a user does, and runs the binary — while asserting the install runs
  # no scripts at all, so nobody ever meets an approval prompt.
  windows-launch:
    name: Windows install & launch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Pack the publishable tarball
        id: pack
        shell: bash
        run: |
          cd apps/echadron
          echo "tarball=$(pwd)/$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      # A dependency with an install script makes npm hold the install behind an
      # approval prompt, and whoever declines gets a half-installed CLI. Every
      # native module we ship must arrive prebuilt instead, so treat the warning
      # as a build failure rather than something to read past.
      - name: Install globally and require zero install scripts
        shell: bash
        run: |
          npm install -g "${{ steps.pack.outputs.tarball }}" 2>&1 | tee install.log
          if grep -qi "allow-scripts" install.log; then
            echo "::error::A dependency wants to run an install script; ship a prebuilt binary instead."
            exit 1
          fi

      - name: Launch it
        shell: bash
        run: |
          echadron --version
          chad --version
          maker --version

  test-windows:
    runs-on: windows-latest
    # The full suite still contains unresolved POSIX-only test assumptions.
    # Keep this job ready for https://github.com/MoonshotAI/kimi-code/issues/225.
    if: false
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: pnpm run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run sherif
      - name: Validate release plan
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main
          pnpm run release:check

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm dlx --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json apps/echadron/tsconfig.json; do
            echo "Typechecking ${config}"
            pnpm dlx --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck Echadron VS Code extension
        run: pnpm --filter echadron-code run typecheck
      - name: Typecheck Echadron web (vue-tsc)
        run: pnpm --filter @yaseenhq/echadron-web run typecheck
      - name: Typecheck vis-server
        run: pnpm --filter @yaseenhq/vis-server run typecheck
      - name: Typecheck vis-web
        run: pnpm --filter @yaseenhq/vis-web run typecheck
