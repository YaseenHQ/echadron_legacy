name: pkg.pr.new

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Echadron preview
    runs-on: ubuntu-latest
    # pkg.pr.new requires its GitHub App to be installed on the repository.
    # Keep previews opt-in for forks until the app is installed there.
    if: github.repository_owner == 'YaseenHQ' && github.event.pull_request.draft == false && vars.PKG_PR_NEW_ENABLED == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package dependencies
        run: pnpm run build:packages

      - name: Build Echadron web assets
        run: pnpm --filter @yaseenhq/echadron-web run build

      - name: Generate Echadron built-in catalog
        shell: bash
        run: |
          CATALOG_FILE="$RUNNER_TEMP/kimi-code-built-in-catalog.json"
          node apps/echadron/scripts/update-catalog.mjs --out "$CATALOG_FILE"
          echo "KIMI_CODE_BUILT_IN_CATALOG_FILE=$CATALOG_FILE" >> "$GITHUB_ENV"

      - name: Build Echadron package
        run: pnpm --filter echadron run build

      - name: Publish pkg.pr.new preview
        run: pnpm exec pkg-pr-new publish --bin --commentWithSha --packageManager=pnpm,npm --no-template './apps/echadron'
